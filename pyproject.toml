    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "kagglehub>=1.0.0",
]
